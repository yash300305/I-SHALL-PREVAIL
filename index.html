<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Shall Prevail</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: red;
      font-family: 'UnifrakturCook', cursive;
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
    }

    .poem {
      max-width: 800px;
      font-size: 1.2rem;
      white-space: pre-wrap;
      margin: 50px auto;
      letter-spacing: 0.05em;
      padding: 0 20px;
      text-align: center;
    }

    .line {
      opacity: 0;
      animation: reveal 0.12s ease-in forwards;
    }

    @keyframes reveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 600px) {
      .poem {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="poem" id="poem"></div>
  <script>
    const lines = [
      "YOU HAVE BEEN QUISHED. STAY TUNED WITH THE SCHOOL OF LAW'S CYBER CELL."
    ];

    const container = document.getElementById("poem");
    let index = 0;
    const delay = 60; // ~500 words per minute

    function showNextLine() {
      if (index < lines.length) {
        const lineElem = document.createElement("div");
        lineElem.classList.add("line");
        lineElem.style.animationDelay = `${index * delay}ms`;
        lineElem.textContent = lines[index];
        container.appendChild(lineElem);
        container.scrollTop = container.scrollHeight;
        index++;
        setTimeout(showNextLine, delay);
      }
    }

    showNextLine();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Shall Prevail</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: red;
      font-family: 'UnifrakturCook', cursive;
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
    }

    .poem {
      max-width: 800px;
      font-size: 1.2rem;
      white-space: pre-wrap;
      margin: 50px auto;
      letter-spacing: 0.05em;
      padding: 0 20px;
      text-align: center;
    }

    .line {
      opacity: 0;
      animation: reveal 0.12s ease-in forwards;
    }

    @keyframes reveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 600px) {
      .poem {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="poem" id="poem"></div>
  <script>
    const lines = [
      "To forget the one that made your heart rush.",
      "To depend on what now makes your heart beat.",
      "To feel her gentle touch again, but now disguised as tears.",
      "To fight fate, only to lose the war.",
      "To win wisdom, at the cost of love.",
      "To grow, shedding the old skin.",
      "To rebuild, after total destruction.",
      "TO RISE FROM THE ASHES, READY TO CONQUER.",
      "",
      "I might die, or I might rise,",
      "Either way, I'll touch the skies.",
      "If I soar, let them cheer my name,",
      "If I fall, let them light a flame.",
      "",
      "May the bridges I burn light my way,",
      "May the burdens I bear build my throne.",
      "May the scars I carve become my shields,",
      "May my sins find grace in battles won.",
      "",
      "For every step, for every fight,",
      "I'll leave behind a trail of light.",
      "And though I stumble, though I break,",
      "Echoes of me will never fade.",
      "",
      "May the darkness I hold fuel my fire,",
      "May my vices be crowned with dark desire.",
      "May the demons I court stand guard by night,",
      "May the shadows and I, together, ignite.",
      "",
      "For even dust, in golden hue,",
      "Finds its place in morning dew.",
      "So if I rise or if I go,",
      "Know that I burned with endless glow.",
      "",
      "To see me, you'll always need a telescope,",
      "For I am not just a man—I am a storm,",
      "A force reborn from fire and ash,",
      "A legend that time can never outlast.",
      "",
      "I SHALL PREVAIL."
    ];

    const container = document.getElementById("poem");
    let index = 0;
    const delay = 60; // ~500 words per minute

    function showNextLine() {
      if (index < lines.length) {
        const lineElem = document.createElement("div");
        lineElem.classList.add("line");
        lineElem.style.animationDelay = `${index * delay}ms`;
        lineElem.textContent = lines[index];
        container.appendChild(lineElem);
        container.scrollTop = container.scrollHeight;
        index++;
        setTimeout(showNextLine, delay);
      }
    }

    showNextLine();
  </script>
</body>
</html>
